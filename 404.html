<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#9f1239">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SportLoop">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" as="image" href="assets/hero.png?v=12">
  <link rel="apple-touch-icon" href="assets/app-icon.png?v=12">
  <title>SportLoop</title>
  <style>
    /* ==================== 1. 用户的 STYLES.CSS 原样导入 ==================== */
    :root {
      --brand: #9f1239;
      --brand-deep: #6f0b27;
      --brand-soft: #fff1f4;
      --ink: #121016;
      --muted: #6f6870;
      --subtle: #9c949b;
      --line: #eadde1;
      --bg: #fbf8f8;
      --card: rgba(255, 255, 255, 0.88);
      --ok: #167444;
      --ok-bg: #e7f6ee;
      --warn: #b45d08;
      --warn-bg: #fff2df;
      --bad: #a10f2b;
      --bad-bg: #ffe6ec;
      --shadow: 0 14px 38px rgba(92, 12, 34, 0.13);
      --shadow-soft: 0 8px 22px rgba(92, 12, 34, 0.08);
      --radius-sm: 10px;
      --radius-md: 18px;
      --radius-lg: 28px;
      --tab-h: 66px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 8%, rgba(159, 18, 57, 0.12), transparent 28%),
        linear-gradient(135deg, #ffffff 0%, #fff7f8 46%, #f5f1ef 100%);
    }

    :where(.page-title, .brand span, .tag, .chip, .text-button, .primary-button, .secondary-button,
      .segmented button, .tab-button span, .kpi span, .metric span, .field > span,
      .profile-stat-label, .profile-shortcut strong, .profile-setting-row strong,
      .profile-setting-row span, .new-stat-label, .new-stat-val, .flow span) {
      word-break: keep-all;
      white-space: nowrap;
    }

    :where(.body-text, .machine-hint, .message-item p, .order-card p, .role-card p,
      .feedback-card-text p, .empty, .borrow-card p) {
      overflow-wrap: anywhere;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(159, 18, 57, 0.25);
      outline-offset: 2px;
    }

    svg {
      width: 24px;
      height: 24px;
    }

    .stage {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: 1fr;
      align-items: start;
      justify-content: center;
      padding: 0;
    }

    .phone-shell {
      display: flex;
      justify-content: center;
      transform: none;
    }

    .phone-frame {
      width: 100%;
      height: 100dvh;
      padding: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(251, 248, 248, 0.96)),
        linear-gradient(135deg, rgba(159, 18, 57, 0.08), transparent 34%);
    }

    .app {
      position: absolute;
      inset: 0;
      padding-top: calc(18px + env(safe-area-inset-top));
    }

    .screen {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 22px calc(var(--tab-h) + 34px + env(safe-area-inset-bottom));
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .scroll::-webkit-scrollbar {
      display: none;
    }

    .topbar,
    .home-top {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 22px 12px;
    }

    .page-title {
      min-width: 0;
      overflow: hidden;
      font-size: clamp(16px, 4.5vw, 19px);
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      font-weight: 800;
    }

    .brand span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    .icon-button,
    .avatar {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      flex: 0 0 46px;
      color: var(--ink);
      border: 1px solid rgba(234, 221, 225, 0.9);
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: var(--shadow-soft);
      transition: transform 180ms ease, background 180ms ease;
    }

    /* [IMAGE-12] 用户头像占位（CSS 渐变；可改为 background-image: url('头像.png')） */
    .avatar {
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 34%, #c9bbc1 0 20%, transparent 21%),
        radial-gradient(circle at 50% 82%, #c9bbc1 0 34%, transparent 35%),
        #fff7f8;
    }

    .avatar.big {
      width: 64px;
      height: 64px;
    }

    .icon-button:active,
    .equipment-card:active,
    .list-card:active,
    .primary-button:active,
    .secondary-button:active,
    .chip:active,
    .tab-button:active,
    .text-button:active {
      transform: scale(0.97);
    }

    .toast {
      position: absolute;
      z-index: 90;
      top: 72px;
      left: 50%;
      max-width: calc(100% - 44px);
      transform: translateX(-50%);
      padding: 10px 14px;
      color: #ffffff;
      border-radius: 999px;
      background: rgba(18, 16, 22, 0.88);
      box-shadow: var(--shadow);
      font-size: 13px;
    }

    .hero-card {
      position: relative;
      min-height: 282px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 48% 52%;
      padding: 0;
      border-radius: 32px;
      color: #ffffff;
      border: 1px solid rgba(159, 18, 57, 0.18);
      background: #fffafa;
      box-shadow: 0 22px 48px rgba(111, 11, 39, 0.24);
    }

    .hero-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      z-index: 0;
      width: 52%;
      background:
        radial-gradient(circle at 16% 10%, rgba(255, 255, 255, 0.2), transparent 26%),
        linear-gradient(145deg, #6f0b27 0%, #9f1239 62%, #b9163f 100%);
    }

    .hero-card::after {
      content: "";
      position: absolute;
      inset: 0 0 0 46%;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(111, 11, 39, 0.24), rgba(255, 250, 250, 0.1) 24%, rgba(255, 250, 250, 0));
    }

    .hero-copy {
      position: relative;
      z-index: 2;
      max-width: none;
      padding: 24px 18px 22px 20px;
      text-shadow: 0 2px 12px rgba(60, 0, 18, 0.18);
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 800;
      color: currentColor;
      opacity: 0.72;
    }

    .hero-card h1,
    .admin-hero h1,
    .detail-title h1,
    .result-card h1,
    .camera-panel h1,
    .profile-head h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .hero-card p:not(.eyebrow),
    .admin-hero p,
    .body-text,
    .camera-panel p,
    .detail-title p,
    .profile-head p {
      margin: 10px 0 0;
      line-height: 1.65;
      color: inherit;
      opacity: 0.78;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 14px 0;
    }

    .kpi {
      min-height: 92px;
      padding: 14px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--card);
      box-shadow: var(--shadow-soft);
    }

    .kpi span,
    .kpi small,
    .metric span,
    .list-card small,
    .equipment-card small,
    .machine-item small,
    .timeline-item span,
    .message-item small,
    .order-card p {
      color: var(--muted);
    }

    .kpi strong {
      display: block;
      margin-top: 8px;
      font-size: 28px;
      font-family: "DIN Alternate", "SF Pro Display", Arial, sans-serif;
    }

    .kpi small {
      margin-left: 2px;
      font-size: 13px;
    }

    .action-panel,
    .active-loan,
    .detail-card,
    .borrow-card,
    .machine-card,
    .camera-panel,
    .result-card,
    .form-card,
    .profile-card,
    .admin-hero,
    .order-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--card);
      box-shadow: var(--shadow-soft);
    }

    .action-panel {
      display: grid;
      gap: 16px;
      padding: 18px;
    }

    .action-panel h2,
    .section-head h2,
    .active-loan h2,
    .borrow-card h2 {
      margin: 0;
      font-size: 20px;
    }

    .action-panel p,
    .active-loan p,
    .borrow-card p,
    .empty {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .active-loan {
      display: grid;
      grid-template-columns: 98px 1fr;
      gap: 14px;
      align-items: center;
      padding: 16px;
    }

    /* [IMAGE-CSS-loan-thumb] [IMAGE-CSS-order-img] 借用卡片 / 工单单图尺寸 */
    .loan-thumb,
    .order-img {
      width: 92px;
      height: 78px;
      object-fit: contain;
    }

    .section-head,
    .list-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 20px 0 12px;
    }

    .text-button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--brand);
      background: transparent;
      font-weight: 800;
    }

    .equipment-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .equipment-card {
      min-height: 178px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 13px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--card);
      box-shadow: var(--shadow-soft);
    }

    /* [IMAGE-CSS-item-img] 器材图：首页热门网格尺寸 */
    .item-img {
      width: 100%;
      height: 100px;
      object-fit: contain;
    }

    .equipment-card strong,
    .list-card strong,
    .message-item strong,
    .order-card strong,
    .machine-item strong {
      display: block;
      min-width: 0;
      overflow: hidden;
      font-size: clamp(13px, 3.8vw, 15px);
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .equipment-card small,
    .list-card small,
    .machine-item small {
      display: block;
      margin-top: 5px;
      overflow: hidden;
      font-size: clamp(10.5px, 3.2vw, 12px);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 24px;
      margin-top: 8px;
      padding: 3px 8px;
      border-radius: 7px;
      font-size: clamp(10.5px, 3vw, 12px);
      font-weight: 800;
    }

    .tag.ok {
      color: var(--ok);
      background: var(--ok-bg);
    }

    .tag.warn {
      color: var(--warn);
      background: var(--warn-bg);
    }

    .tag.bad {
      color: var(--bad);
      background: var(--bad-bg);
    }

    .flow {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--card);
      box-shadow: var(--shadow-soft);
    }

    .flow div {
      text-align: center;
      font-size: clamp(9px, 2.8vw, 11px);
      line-height: 1.35;
    }

    .flow span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .flow i {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      margin: 0 auto 6px;
      color: var(--brand);
      border-radius: 50%;
      background: var(--brand-soft);
    }

    .flow b {
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      margin: -10px auto 5px;
      color: #ffffff;
      border-radius: 50%;
      background: var(--brand);
      font-size: 10px;
    }

    .search-row {
      padding: 0 22px 14px;
    }

    .search-box {
      position: relative;
      display: block;
    }

    .search-box svg {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .search-box input {
      width: 100%;
      height: 54px;
      padding: 0 16px 0 48px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--ink);
      background: var(--card);
      box-shadow: var(--shadow-soft);
    }

    .chips {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      min-height: 44px;
      flex: 0 0 auto;
      padding: 0 clamp(13px, 4vw, 17px);
      color: var(--ink);
      font-size: clamp(12px, 3.5vw, 14px);
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: var(--shadow-soft);
    }

    .chip.active {
      color: #ffffff;
      border-color: transparent;
      background: linear-gradient(145deg, var(--brand), var(--brand-deep));
    }

    .list-stack,
    .timeline,
    .message-list,
    .admin-list {
      display: grid;
      gap: 10px;
    }

    .list-card {
      width: 100%;
      min-height: 116px;
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px;
      overflow: hidden;
      text-align: left;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--card);
      box-shadow: var(--shadow-soft);
    }

    .list-card.static {
      cursor: default;
    }

    .list-card > span:not(.list-media) {
      min-width: 0;
    }

    .list-media {
      position: relative;
      width: 112px;
      height: 86px;
      display: grid;
      place-items: center;
      flex: 0 0 112px;
      overflow: hidden;
      border-radius: 14px;
      background: #ffffff;
    }

    /* [IMAGE-CSS-list-img] 器材图：列表/管理员档案缩略图尺寸 */
    .list-img {
      display: block;
      width: 92px;
      height: 72px;
      object-fit: contain;
      object-position: center;
      margin: auto;
    }

    .detail-card,
    .result-card {
      padding: 18px;
    }

    /* [IMAGE-CSS-detail-img] 器材图：详情页/借用确认/检测结果大图尺寸 */
    .detail-img {
      width: 100%;
      height: 228px;
      object-fit: contain;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(159, 18, 57, 0.08), rgba(255, 255, 255, 0.7));
    }

    .detail-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 16px 0;
    }

    .metric {
      padding: 13px 8px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.65);
    }

    .metric strong {
      display: block;
      margin-bottom: 4px;
      font-size: clamp(20px, 5.6vw, 22px);
      font-family: "DIN Alternate", "SF Pro Display", Arial, sans-serif;
      white-space: nowrap;
    }

    .metric span {
      font-size: clamp(12px, 3.5vw, 14px);
    }

    .info-list {
      display: grid;
      gap: 9px;
      margin: 16px 0;
    }

    .info-list div,
    .timeline-item {
      padding: 12px clamp(9px, 3vw, 13px);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.7);
    }

    .info-list div {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      align-items: center;
      column-gap: clamp(9px, 3vw, 16px);
      min-height: 58px;
    }

    .info-list span {
      color: var(--muted);
      line-height: 1.35;
      white-space: nowrap;
    }

    .info-list strong {
      min-width: 0;
      font-size: clamp(11.8px, 3.05vw, 14.5px);
      line-height: 1.45;
      text-align: right;
      text-wrap: balance;
      overflow-wrap: anywhere;
      white-space: normal;
    }

    .duration-picker {
      display: grid;
      gap: 10px;
      margin: 16px 0;
      padding: 14px;
      border: 1px solid rgba(159, 18, 57, 0.12);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.74);
      box-shadow: var(--shadow-soft);
    }

    .duration-picker-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .duration-picker-head strong {
      font-size: clamp(14px, 3.9vw, 15px);
    }

    .duration-picker-head span {
      color: var(--muted);
      font-size: clamp(11px, 3.2vw, 12px);
      white-space: nowrap;
    }

    .duration-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .duration-option {
      min-height: 64px;
      display: grid;
      align-content: center;
      gap: 4px;
      padding: 9px 6px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #ffffff;
    }

    .duration-option strong {
      font-size: clamp(14px, 4.2vw, 16px);
      line-height: 1;
      white-space: nowrap;
    }

    .duration-option span {
      color: var(--muted);
      font-size: clamp(10px, 3vw, 11px);
      white-space: nowrap;
    }

    .duration-option.active {
      color: #ffffff;
      border-color: transparent;
      background: linear-gradient(145deg, var(--brand), var(--brand-deep));
      box-shadow: 0 12px 20px rgba(159, 18, 57, 0.2);
    }

    .duration-option.active span {
      color: rgba(255, 255, 255, 0.76);
    }

    .primary-button,
    .secondary-button {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 0;
      width: 100%;
      padding: 0 clamp(10px, 3.8vw, 16px);
      border-radius: 17px;
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 850;
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .primary-button {
      color: #ffffff;
      background: linear-gradient(145deg, #c91946, #8c102e);
      box-shadow: 0 16px 28px rgba(159, 18, 57, 0.22);
    }

    .secondary-button {
      color: var(--brand);
      border: 1px solid rgba(159, 18, 57, 0.18);
      background: rgba(255, 255, 255, 0.8);
    }

    .primary-button:disabled,
    .secondary-button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
      box-shadow: none;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .loan-action-row {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .button-row .primary-button,
    .button-row .secondary-button {
      font-size: clamp(12px, 3.5vw, 15px);
    }

    .machine-card {
      padding: 18px;
    }

    .machine-visual {
      height: 260px;
      display: grid;
      place-items: center;
      text-align: center;
      color: #ffffff;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.18), transparent 28%),
        linear-gradient(145deg, #211d20, #090809);
    }

    .scan-frame {
      width: 138px;
      height: 138px;
      display: grid;
      place-items: center;
      margin-bottom: 12px;
      border: 2px dashed rgba(255, 255, 255, 0.56);
      border-radius: 32px;
    }

    .scan-frame svg {
      width: 48px;
      height: 48px;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-top: 15px;
      font-weight: 800;
    }

    .field > span {
      font-size: clamp(13px, 3.7vw, 15px);
    }

    .field input,
    .field select,
    .field textarea {

      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 15px;

    .field textarea {

    .machine-item {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 12px;
      align-items: center;
      margin: 14px 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.7);
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin: 12px 0;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.68);

    .segmented button {
      min-height: 44px;
      border-radius: 13px;
      color: var(--ink);
      background: transparent;
      font-size: clamp(12px, 3.6vw, 14px);
      font-weight: 800;
    }

    .segmented button.active {
      color: #ffffff;
      background: var(--brand);
    }

    .borrow-card {
      padding: 15px;
    }

    .borrow-head {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 14px;
      align-items: center;
    }

    .camera-panel {
      overflow: hidden;
      padding: 18px;
      color: #ffffff;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.78)),
        #111111;
    }

    .camera-box {
      position: relative;
      height: 286px;
      display: grid;
      place-items: center;
      margin-bottom: 16px;
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
    }

    /* [IMAGE-CSS-camera-img] 器材图：归还检测 / 同步页取景框内尺寸 */
    .camera-img {
      width: 260px;
      height: 210px;
      object-fit: contain;
      filter: drop-shadow(0 20px 22px rgba(0, 0, 0, 0.36));
    }

    .scan-line {
      position: absolute;
      left: 14px;
      right: 14px;
      top: 50%;
      height: 2px;
      background: #ffffff;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.78);
    }

    @keyframes scanSweep {
      0%, 100% { top: 14%; opacity: 0.4; }
      50% { top: 82%; opacity: 1; }
    }

    @keyframes scanPulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }

    @keyframes scanSuccessPop {
      0% { transform: scale(0.88); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .scan-screen {
      position: absolute;
      inset: 0;
      z-index: 90;
      display: flex;
      flex-direction: column;
      color: #ffffff;
      background: #050506;
    }

    .scan-screen-header {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) 46px;
      align-items: center;
      column-gap: 10px;
      min-height: 58px;
      padding: 14px 24px 12px;
      flex-shrink: 0;
    }

    .scan-screen-header .page-title {
      color: #ffffff;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scan-screen-header .scan-header-spacer {
      width: 46px;
      height: 46px;
    }

    .scan-screen-header .icon-button {
      position: relative;
      z-index: 2;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.14);
    }

    .scan-screen-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 24px 48px;
      text-align: center;
    }

    .scan-viewfinder {
      position: relative;
      width: min(100%, 292px);
      aspect-ratio: 1;
      margin-bottom: 22px;
      border-radius: 22px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.58)),
        radial-gradient(circle at 50% 18%, rgba(159, 18, 57, 0.32), transparent 44%),
        #171416;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.42);
    }

    .scan-camera-feed {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .scan-camera-feed .camera-img,
    .scan-camera-feed img,
    .scan-camera-feed .equipment-placeholder-emoji {
      width: 72%;
      max-height: 58%;
      object-fit: contain;
      filter: brightness(0.9) contrast(1.05);
    }

    .scan-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 22px 22px;
      pointer-events: none;
    }

    .scan-corner {
      position: absolute;
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.92);
      pointer-events: none;
    }

    .scan-corner.tl {
      top: 16px;
      left: 16px;
      border-right: 0;
      border-bottom: 0;
      border-top-left-radius: 10px;
    }

    .scan-corner.tr {
      top: 16px;
      right: 16px;
      border-left: 0;
      border-bottom: 0;
      border-top-right-radius: 10px;
    }

    .scan-corner.bl {
      bottom: 16px;
      left: 16px;
      border-right: 0;
      border-top: 0;
      border-bottom-left-radius: 10px;
    }

    .scan-corner.br {
      bottom: 16px;
      right: 16px;
      border-left: 0;
      border-top: 0;
      border-bottom-right-radius: 10px;
    }

    .scan-line-animated {
      position: absolute;
      left: 12%;
      right: 12%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ffffff, transparent);
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.85);
      animation: scanSweep 2s ease-in-out infinite;
    }

    .scan-barcode-mock {
      position: absolute;
      left: 50%;
      bottom: 22%;
      width: 58%;
      height: 42px;
      transform: translateX(-50%);
      border-radius: 6px;
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.88) 0 3px, transparent 3px 7px);
      opacity: 0.72;
      pointer-events: none;
    }

    .scan-hint {
      margin: 0;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.72);
      line-height: 1.5;
    }

    .scan-hint strong {
      display: block;
      margin-top: 6px;
      color: #ffffff;
      font-size: 18px;
    }

    .scan-status-text {
      margin: 14px 0 0;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.55);
    }

    .scan-status-text.is-scanning {
      animation: scanPulse 1.6s ease-in-out infinite;
    }

    .scan-success-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: rgba(8, 10, 12, 0.76);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .scan-success-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .scan-success-card {
      width: min(88%, 260px);
      padding: 28px 22px;
      border-radius: 24px;
      text-align: center;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(12px);
      animation: scanSuccessPop 0.35s ease;
    }

    .scan-success-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--ok);
      background: var(--ok-bg);
    }

    .scan-success-icon svg {
      width: 36px;
      height: 36px;
    }

    .borrow-confirm-hero {
      text-align: center;
      margin-bottom: 16px;
    }

    .borrow-confirm-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--ok);
      background: var(--ok-bg);
    }

    .borrow-confirm-badge svg {
      width: 32px;
      height: 32px;
    }

    .sync-visual {
      position: relative;
      width: min(100%, 220px);
      height: 220px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
    }

    .sync-ring {
      position: absolute;
      inset: 0;
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      animation: syncRing 2.2s ease-out infinite;
    }

    .sync-ring:nth-child(2) {
      animation-delay: 0.55s;
    }

    .sync-ring:nth-child(3) {
      animation-delay: 1.1s;
    }

    @keyframes syncRing {
      0% { transform: scale(0.42); opacity: 0.9; }
      100% { transform: scale(1.05); opacity: 0; }
    }

    .sync-core {
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #ffffff;
      background: rgba(159, 18, 57, 0.88);
      box-shadow: 0 12px 28px rgba(159, 18, 57, 0.45);
    }

    .sync-core svg {
      width: 40px;
      height: 40px;
    }

    .machine-hint {
      margin: 0 0 14px;

      border-radius: 14px;

      color: var(--brand);
      font-size: 15px;
      white-space: nowrap;
    }

    .profile-file {
      position: relative;
      isolation: isolate;
      aspect-ratio: 1400 / 1024;
      width: 100%;
      margin: 12px 0 20px;
      overflow: visible;
    }

    .profile-file::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 11% -3% -2%;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(246, 239, 243, 0.96), rgba(238, 228, 235, 0.9));
      box-shadow:
        0 18px 28px rgba(92, 12, 34, 0.13),
        inset 0 0 0 1px rgba(159, 18, 57, 0.07);
    }

    .profile-file::after {
      content: "";
      position: absolute;
      z-index: 0;
      left: 12%;
      right: 12%;
      bottom: -1%;
      height: 13%;
      border-radius: 999px;
      background: rgba(92, 12, 34, 0.12);
      box-shadow: 0 10px 20px rgba(92, 12, 34, 0.12);
    }

    .profile-folder-img {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      pointer-events: none;
      user-select: none;
      filter: none;
    }

    .profile-file-card {
      position: absolute;
      z-index: 2;
      top: 16.2%;
      right: 7.2%;
      bottom: 7.2%;
      left: 7.2%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      align-content: start;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .profile-file-card::after {
      content: none;
    }

    .profile-file-title {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: clamp(14px, 4vw, 18px);
      padding-left: 2px;
    }

    .profile-file-title h2 {
      margin: 0;
      font-size: clamp(15px, 4.1vw, 20px);
      line-height: 1;
      font-weight: 900;
    }

    .profile-round-link {
      width: clamp(18px, 5.4vw, 23px);
      height: clamp(18px, 5.4vw, 23px);
      display: grid;
      place-items: center;
      color: #ffffff;
      border-radius: 50%;
      background: var(--brand);
    }

    .profile-round-link svg {
      width: 14px;
      height: 14px;
    }

    .profile-file-panel {
      position: relative;
      z-index: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      border: 0;
      border-radius: 0;
      background: transparent;
      overflow: hidden;
    }

    .profile-file-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      min-height: 0;
      align-items: stretch;
    }

    .profile-file-metric {
      position: relative;
      min-height: 0;
      display: grid;
      align-content: center;
      padding: clamp(6px, 2.2vw, 14px) clamp(4px, 2vw, 10px);
      border-right: 1px solid rgba(159, 18, 57, 0.18);
    }

    .profile-file-metric:last-child {
      border-right: 0;
    }

    .profile-file-metric span {
      display: flex;
      align-items: center;
      gap: clamp(3px, 1.2vw, 6px);
      color: var(--ink);
      font-size: clamp(8px, 2.6vw, 12px);
      font-weight: 700;
      white-space: nowrap;
    }

    .profile-file-metric span svg {
      width: clamp(13px, 4vw, 18px);
      height: clamp(13px, 4vw, 18px);
      color: var(--brand);
    }

    .profile-file-metric strong {
      display: block;
      margin-top: clamp(8px, 2.8vw, 14px);
      font-size: clamp(17px, 5.2vw, 26px);
      line-height: 1;
      font-weight: 900;
      white-space: nowrap;
    }

    .profile-file-metric strong em {
      color: var(--brand);
      font-style: normal;
    }

    .profile-file-actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: center;
      margin: 0 2px;
      border: 0;
      background: transparent;
      overflow: visible;
    }

    .profile-file-actions button {
      min-height: clamp(28px, 9.4vw, 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--ink);
      background: transparent;
      border-right: 0;
      font-size: clamp(8px, 2.7vw, 11px);
      font-weight: 800;
      white-space: nowrap;
    }

    .profile-file-actions button:last-child {
      border-right: 0;
    }

    .profile-file-actions .profile-return-button {
      min-height: 29px;
      margin: 4px 3px;
      color: #ffffff;
      border-radius: 999px;
      background: var(--brand);
      border-right: 0;
    }

    .profile-file-actions svg {
      width: clamp(13px, 4vw, 16px);
      height: clamp(13px, 4vw, 16px);
      color: var(--brand);
    }

    .profile-file-actions .profile-return-button svg {
      width: 15px;
      height: 15px;
      color: currentColor;
    }

    .profile-stats-card {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: minmax(74px, 0.75fr) 1px minmax(0, 1.55fr);
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 18px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: var(--shadow-soft);
    }

    .profile-divider {
      width: 1px;
      height: 86px;
      background: var(--line);
    }

    .profile-stat-label {
      margin: 0;
      font-size: clamp(14px, 4vw, 16px);
      font-weight: 800;
      white-space: nowrap;
    }

    .profile-stat-value {
      margin: 14px 0 0;
      font-size: clamp(28px, 8.5vw, 34px);
      line-height: 1;
      font-weight: 900;
      white-space: nowrap;
    }

    .profile-stat-value small {
      font-size: clamp(12px, 3.8vw, 15px);
      font-weight: 700;
    }

    .profile-stat-note {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: clamp(11px, 3.3vw, 13px);
    }

    .profile-stat-note b {
      color: var(--brand);
    }

    .profile-rate {
      display: grid;
      grid-template-columns: minmax(82px, 0.85fr) minmax(72px, 1fr);
      align-items: end;
      gap: 6px;
    }

    .profile-rate-chart {
      width: 100%;
      height: 64px;
    }

    .profile-shortcuts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .profile-shortcut {
      min-height: 92px;
      display: grid;
      align-content: center;
      gap: 7px;
      padding: clamp(7px, 2.2vw, 10px);
      text-align: left;
      color: var(--ink);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow-soft);
    }

    .profile-shortcut i {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: var(--brand);
      border-radius: 12px;
      background: var(--brand-soft);
      font-style: normal;
    }

    .profile-shortcut i svg {
      width: 20px;
      height: 20px;
    }

    .profile-shortcut strong {
      overflow: hidden;
      font-size: clamp(9.5px, 2.95vw, 12.5px);
      line-height: 1.15;
      text-overflow: ellipsis;
    }

    .profile-shortcut span {
      color: var(--muted);
      overflow: hidden;
      font-size: clamp(8.5px, 2.7vw, 10px);
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .profile-settings {
      margin-bottom: 10px;
      padding: 10px 18px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow-soft);
    }

    .profile-setting-row {
      width: 100%;
      min-height: 61px;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) auto 20px;
      align-items: center;
      gap: 11px;
      padding: 0;
      color: var(--ink);
      background: transparent;
      border-bottom: 1px solid rgba(234, 221, 225, 0.85);
      text-align: left;
    }

    .profile-setting-row:last-child {
      border-bottom: 0;
    }

    .profile-setting-row svg {
      width: 24px;
      height: 24px;
    }

    .profile-setting-row strong {
      min-width: 0;
      overflow: hidden;
      font-size: clamp(13px, 3.7vw, 15px);
      text-overflow: ellipsis;
    }

    .profile-setting-row span {
      color: var(--muted);
      max-width: 42vw;
      overflow: hidden;
      font-size: clamp(10px, 3vw, 12px);
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .profile-setting-row .chev {
      color: var(--muted);
      width: 18px;
      height: 18px;
    }

    .empty {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.72);
    }

    .tabbar {
      position: absolute;
      z-index: 60;
      left: 32px;
      right: 32px;
      bottom: calc(8px + env(safe-area-inset-bottom));
      height: var(--tab-h);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      padding: 5px;
      border: 1px solid rgba(234, 221, 225, 0.86);
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 12px 26px rgba(36, 24, 28, 0.12);
      backdrop-filter: blur(16px);
    }

    .tab-button {
      min-height: 52px;
      display: grid;
      place-items: center;
      gap: 2px;
      color: var(--muted);
      border-radius: 19px;
      background: transparent;
      transition: transform 180ms ease, color 180ms ease, background 180ms ease;
    }

    .tab-button.active {
      color: var(--brand);
      background: var(--brand-soft);
      font-weight: 850;
    }

    .tab-button span {
      font-size: clamp(10px, 2.9vw, 11px);
    }

    .tab-button svg {
      width: 21px;
      height: 21px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      font-size: 24px;
      font-weight: 800;
    }

    /* [IMAGE-10] 首页顶栏 App 图标 | [IMAGE-11] 右侧说明区 Logo */
    .logo-mark {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--brand);
      object-fit: cover;
      flex-shrink: 0;
    }

    .brand .app-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
    }

    .note-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .note-grid button {
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--ink);
      background: var(--card);
    }

    /* 电脑大屏说明面板结构 */
    .prototype-notes {
      display: none;
    }

    .login-center {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .login-hero {
      display: grid;
      place-items: center;
      gap: 14px;
      margin-bottom: 36px;
    }

    .login-icon {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      box-shadow: 0 14px 32px rgba(159, 18, 57, 0.18);
    }

    .login-hero h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
    }

    .login-hero p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .login-btn {
      max-width: 280px;
    }

    .role-grid {
      display: grid;
      gap: 16px;
      margin-top: 24px;
    }

    .role-card {
      min-height: 148px;
      display: grid;
      place-items: center;
      gap: 6px;
      padding: 26px 20px;
      text-align: center;
      color: var(--ink);
      border: 2px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--card);
      box-shadow: var(--shadow-soft);
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .role-card:active {
      transform: scale(0.97);
      border-color: var(--brand);
    }

    .role-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--brand);
      background: var(--brand-soft);
    }

    .role-icon svg {
      width: 26px;
      height: 26px;
    }

    .role-card h2 {
      margin: 0;
      font-size: clamp(17px, 5vw, 20px);
    }

    .role-card p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(11.5px, 3.4vw, 13px);
      line-height: 1.5;
    }

    .login-form {
      margin-top: 24px;
    }

    .login-avatar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .role-badge {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--brand);
      background: var(--brand-soft);
    }

    .role-badge svg {
      width: 32px;
      height: 32px;
    }

    .login-avatar span {
      font-size: 15px;
      font-weight: 800;
      color: var(--muted);
    }

    .login-hint {
      margin: 8px 0 0;
      text-align: center;
      color: var(--subtle);
      font-size: 12px;
    }

    .login-form-status {
      min-height: 20px;
      margin: 10px 0 0;
      text-align: center;
      color: var(--brand);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .login-form-status:empty {
      display: none;
    }

    .login-switch {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .login-switch .text-button {
      min-height: 34px;
      padding: 0 4px;
      font-size: 13px;
    }

    .locked-equip {
      min-height: 50px;
      display: flex;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--ink);
      background: var(--brand-soft);
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .login-form .primary-button {
      margin-top: 20px;
    }

    .confirm-overlay {
      position: absolute;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .confirm-dialog {
      width: 280px;
      padding: 24px 20px 18px;
      border-radius: 22px;
      text-align: center;
      background: #ffffff;
      box-shadow: 0 24px 52px rgba(0, 0, 0, 0.22);
    }

    .confirm-dialog p {
      margin: 0 0 20px;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.5;
    }

    .confirm-dialog h2 {
      margin: 0 0 16px;
      color: var(--ink);
      font-size: 19px;
      line-height: 1.2;
    }

    .name-dialog {
      width: min(300px, calc(100% - 44px));
      text-align: left;
    }

    .name-dialog input {
      width: 100%;
      min-height: 48px;
      margin: 0 0 16px;
      padding: 0 14px;
      border: 1px solid rgba(159, 18, 57, 0.18);
      border-radius: 15px;
      color: var(--ink);
      background: rgba(255, 247, 250, 0.72);
      font-size: 17px;
      font-weight: 800;
      outline: none;
    }

    .name-dialog input:focus {
      border-color: rgba(159, 18, 57, 0.5);
      box-shadow: 0 0 0 4px rgba(159, 18, 57, 0.1);
    }

    .confirm-dialog .confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .confirm-dialog .btn-cancel {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.8);
      font-weight: 800;
    }

    .confirm-dialog .btn-danger {
      min-height: 44px;
      border: 0;
      border-radius: 14px;
      color: #ffffff;
      background: var(--bad);
      font-weight: 800;
    }

    @media (min-width: 1024px) {
      .stage {
        min-height: 100vh;
        grid-template-columns: 430px minmax(320px, 500px);
        gap: 60px;
        align-items: center;
        padding: 16px;
      }

      .phone-shell {
        transform: scale(0.82);
        transform-origin: top center;
      }

      .phone-frame {
        width: 430px;
        height: 914px;
        padding: 14px;
        border-radius: 64px;
        background: linear-gradient(145deg, #161315, #050505 46%, #393436 58%, #080808);
        box-shadow:
          inset 0 0 0 2px rgba(255, 255, 255, 0.13),
          inset 0 0 0 7px #000000,
          0 32px 90px rgba(44, 18, 24, 0.28);
      }

      .phone-screen {
        border-radius: 52px;
      }

      .prototype-notes {
        display: block;
      }

      .prototype-notes h1 {
        margin: 0;
        font-size: 44px;
        line-height: 1.12;
      }

      .prototype-notes p {
        color: var(--muted);
        font-size: 17px;
        line-height: 1.7;
      }
    }

    @media (max-width: 360px) {
      .equipment-grid,
      .kpi-grid,
      .metric-row,
      .button-row,
      .loan-action-row,
      .admin-actions {
        grid-template-columns: 1fr;
      }

      .active-loan,
      .borrow-head,
      .machine-item,
      .order-card {
        grid-template-columns: 1fr;
      }

      .info-list strong {
        white-space: normal;
      }
    }

    @media (max-width: 480px) and (max-height: 760px) {
      .profile-topbar {
        min-height: 54px;
        padding: 0 24px 6px;
      }

      .profile-scroll {
        padding: 0 18px calc(var(--tab-h) + 30px + env(safe-area-inset-bottom));
      }

      .profile-identity {
        grid-template-columns: 76px minmax(0, 1fr) 22px;
        gap: 14px;
        padding: 6px 0 10px;
      }

      .profile-main-avatar {
        width: 76px;
        height: 76px;
      }

      .profile-meta {
        margin-top: 4px;
        font-size: 12px;
      }

      .profile-file {
        width: min(92%, 350px);
        margin: 2px auto 12px;
      }

      .profile-file::before {
        content: "";
        inset: 12% -2.5% -1%;
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(246, 239, 243, 0.96), rgba(238, 228, 235, 0.9));
        box-shadow:
          0 14px 22px rgba(92, 12, 34, 0.12),
          inset 0 0 0 1px rgba(159, 18, 57, 0.065);
      }

      .profile-file::after {
        left: 13%;
        right: 13%;
        bottom: 0;
        height: 12%;
        background: rgba(92, 12, 34, 0.11);
        box-shadow: 0 8px 16px rgba(92, 12, 34, 0.11);
      }

      .profile-folder-img {
        filter: none;
      }

      .profile-file-title {
        margin-bottom: clamp(10px, 3vw, 14px);
      }

      .profile-stats-card {
        margin-bottom: 12px;
        padding: 14px 16px;
        border-radius: 22px;
      }

      .profile-divider {
        height: 74px;
      }

      .profile-stat-value {
        margin-top: 10px;
        font-size: clamp(26px, 8vw, 32px);
      }
    }

    @media (min-width: 481px) and (max-width: 1023px) {
      .topbar,
      .home-top,
      .search-row,
      .scroll > * {
        width: min(520px, calc(100% - 44px));
        margin-left: auto;
        margin-right: auto;
      }

      .profile-topbar,
      .profile-scroll > section {
        width: min(430px, calc(100% - 44px));
        margin-left: auto;
        margin-right: auto;
      }

      .topbar,
      .home-top,
      .profile-topbar {
        padding-left: 0;
        padding-right: 0;
      }

      .search-row,
      .scroll,
      .profile-scroll {
        padding-left: 0;
        padding-right: 0;
      }

      .tabbar {
        left: 50%;
        right: auto;
        width: min(396px, calc(100% - 56px));
        transform: translateX(-50%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }

    /* 针对表情符号做占位处理 */
    .equipment-placeholder-emoji {
      font-size: 32px;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }

    /* ==================== 2. ⚡ 新首页样式 — 背景图片 Hero ==================== */
    .new-hero-container {
      background:
        linear-gradient(rgba(0, 0, 0, 0.10), rgba(0, 0, 0, 0.10)),
        url("assets/hero.png?v=12") center/cover no-repeat;
      padding: 22px 18px;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
      min-height: 290px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .new-hero-left {
      position: relative;
      z-index: 2;
      display: flex;

      if (authSession?.accessToken) headers.Authorization = `Bearer ${authSession.accessToken}`;
      return headers;
    }

    async function supabaseAuthRequest(path, body) {
      const response = await fetch(`${SUPABASE_URL}/auth/v1/${path}`, {
        method: "POST",
        headers: supabaseHeaders(),
        body: JSON.stringify(body),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.msg || data.message || data.error_description || data.error || "认证失败");
      return data;
    }

    async function supabaseRequest(path, options = {}) {
      if (!authSession?.accessToken) throw new Error("请先登录");
      const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        method: options.method || "GET",
        headers: supabaseHeaders(options.headers || {}),
        body: options.body ? JSON.stringify(options.body) : undefined,
      });
      if (response.status === 204) return null;
      const text = await response.text();
      const data = text ? JSON.parse(text) : null;
      if (!response.ok) throw new Error(data?.message || data?.hint || "数据库请求失败");
      return data;
    }

    function usernameToSafeEmail(username) {
      const bytes = new TextEncoder().encode(username);
      const binary = Array.from(bytes, (byte) => String.fromCharCode(byte)).join("");
      const safe = btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      return `u-${safe}@sportloop.app`;
    }

    function normalizeLoginEmail(account) {
      const raw = String(account || "").trim().normalize("NFKC").toLowerCase();
      if (!raw) throw new Error("账号不能为空");
      if (raw.includes("@")) return raw;
      return usernameToSafeEmail(raw);
    }

    async function handleLogin(account, password) {
      const role = state.loginRole || "student";
      const email = normalizeLoginEmail(account);
      try {
        const data = await supabaseAuthRequest("token?grant_type=password", { email, password });
        await finishAuth(data, role, role === "admin" ? "管理员登录成功" : "学生登录成功");
      } catch (error) {
        const message = String(error.message || "");
        if (message.includes("Invalid login credentials")) throw new Error("账号未注册或密码错误，请先注册");
        throw error;
      }
    }

    async function handleRegister(account, password) {
      const role = state.loginRole || "student";
      const email = normalizeLoginEmail(account);
      const data = await supabaseAuthRequest("signup", { email, password });
      if (data.user?.identities && data.user.identities.length === 0) {
        throw new Error("这个账号已经注册过，请直接登录");
      }
      if (!data.access_token) {
        state.route = "credentials";
        state.notice = "注册成功，请返回登录。如果登录不了，请在 Supabase 关闭邮箱确认";
        render();
        return;
      }
      await finishAuth(data, role, role === "admin" ? "管理员注册成功" : "学生注册成功");
    }

    async function finishAuth(data, role, successMessage) {
      const user = data.user || {};
      saveAuthSession({
        accessToken: data.access_token,
        refreshToken: data.refresh_token,
        expiresAt: data.expires_at || Math.floor(Date.now() / 1000) + Number(data.expires_in || 3600),
        userId: user.id,
        email: user.email || email,
        role,
      });
      await loadRemoteStore();
      state.route = role === "admin" ? "admin" : "home";
      state.notice = successMessage;
      render();
    }

    async function loadRemoteStore() {
      if (!authSession?.accessToken) return;
      const adminRows = await supabaseRequest(`admin_users?select=user_id&user_id=eq.${authSession.userId}`);
      state.isAdmin = adminRows.length > 0;

      const [equipmentRows, profileRows, loanRows, messageRows, contactRows, orderRows] = await Promise.all([
        supabaseRequest("equipment?select=*&order=name.asc"),
        supabaseRequest(`student_profiles?select=*&user_id=eq.${authSession.userId}`),
        supabaseRequest("loans?select=*&order=created_at.desc"),
        supabaseRequest("student_messages?select=*&order=created_at.desc"),
        supabaseRequest("admin_contacts?select=*&order=created_at.desc"),
        supabaseRequest("work_orders?select=*&order=created_at.desc"),
      ]);

      if (equipmentRows.length) store.equipment = equipmentRows.map(dbEquipmentToLocal);
      store.profile = profileRows.length ? { ...emptyRemoteProfile(), ...dbProfileToLocal(profileRows[0]) } : emptyRemoteProfile();
      store.loans = loanRows.map(dbLoanToLocal);
      store.messages = messageRows.length ? messageRows.map(dbMessageToLocal) : clone(seed.messages);
      store.adminMessages = contactRows.map(dbContactToLocal);
      store.workOrders = orderRows.map(dbWorkOrderToLocal);
      saveStore();
    }

    async function refreshRemoteStore() {
      if (!authSession?.accessToken || state.remoteLoading) return;
      state.remoteLoading = true;
      const routeBefore = state.route;
      try {
        await loadRemoteStore();
        if (state.route === routeBefore) render();
      } catch (error) {
        console.error(error);
        state.notice = `数据库同步失败：${error.message}`;
        render();
      } finally {
        state.remoteLoading = false;
      }
    }

    /** 将路径转为浏览器可用的 src（相对路径 / 正斜杠 / file:// / URL 编码） */
    function toImageSrc(raw) {
      if (!raw) return "";
      const s = String(raw).trim();
      if (/^(https?:|data:|blob:|file:)/i.test(s)) return s;

      const forward = s.replace(/\\/g, "/");
      const encodeSeg = (seg) => (/[^\x00-\x7F]/.test(seg) ? encodeURIComponent(seg) : seg);

      if (/^[a-zA-Z]:/.test(forward)) {
        const m = forward.match(/^([a-zA-Z]):\/?(.*)$/);
        if (!m) return forward;
        const segments = m[2].split("/").filter(Boolean).map(encodeSeg);
        return `file:///${m[1]}:/${segments.join("/")}`;
      }

      return forward.split("/").map(encodeSeg).join("/");
    }

    function escapeAttr(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    /** 静态资源 URL 加版本参数，绕过浏览器对同名图片的强缓存 */
    function assetUrl(path) {
      const src = toImageSrc(path);
      if (!src || /^(data:|blob:)/i.test(src)) return src;
      const join = src.includes("?") ? "&" : "?";
      return `${src}${join}v=${ASSET_VERSION}`;
    }

    // [IMAGE-FN] 器材图统一渲染：所有页面的器材缩略图/大图均由此函数输出 <img>
    function equipmentImage(item, className = "item-img") {
      const src = assetUrl(item.image);
      const hasImageFile = src && (src.includes(".") || src.startsWith("data:") || src.startsWith("file:"));

      if (hasImageFile) {
        return `
          <div class="${className}" style="display:flex; align-items:center; justify-content:center; background:rgba(159,18,57,0.03); border-radius:12px; overflow:hidden; width:100%; height:100%;">
            <img src="${escapeAttr(src)}" alt="${escapeAttr(item.name)}" loading="lazy" decoding="async" style="width:100%; height:100%; object-fit:cover;" onerror="this.onerror=null; this.parentElement.innerHTML='⚽';"><!-- [IMAGE-ERR] 加载失败兜底 -->
          </div>
        `;
      }
      
      return `<span class="${className} equipment-placeholder-emoji" style="display:flex; align-items:center; justify-content:center; background:rgba(159,18,57,0.05); border-radius:12px; font-size:48px;">${item.image || '🏀'}</span>`; /* [IMAGE-PH] 无图片 URL 时用 emoji；也可把 image 设为 "🏓" 等 */
    }

    // ⚡ 完美重组的首页核心渲染方法：保留全部原有生态，只精准重构顶部卡片和加上反馈入口
    function homePage() {
      const totalAvailable = store.equipment.reduce((sum, item) => sum + item.available, 0);
      const openVenues = new Set(store.equipment.filter((item) => item.available > 0).map((item) => cleanVenue(item.venue))).size;
      const health = Math.round(store.equipment.reduce((sum, item) => sum + item.health, 0) / store.equipment.length);
      const currentLoan = activeLoan();

      return `
        <section class="screen home-screen">
          <header class="home-top">
            <button class="icon-button" data-route="messages" aria-label="消息通知">${icon("bell")}</button>
            <div class="brand"><img class="logo-mark app-icon" src="${escapeAttr(assetUrl(APP_ICON_SRC))}" alt="SportLoop" decoding="async" /><!-- [IMAGE-10] --><span>SportLoop</span></div>
            <button class="icon-button" data-route="list" aria-label="器材列表">${icon("search")}</button>
          </header>
          ${loginStatusHtml()}
          <main class="scroll">
            
            <!-- 📷 完美像素级还原参考图样式的头部卡片组 -->
            <section class="new-hero-container">
              <div class="new-hero-left">
                <h1 class="new-hero-title">今天</h1>
                <h1 class="new-hero-title">想打什么球？</h1>
                <p class="new-hero-subtitle">先看状态，再去借用</p>

                <div class="new-stats-stack">
                  <!-- 1. 今日可借 -->
                  <div class="new-stat-card">
                    <div class="new-stat-icon-wrapper red-theme">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><polyline points="8 14 10 16 14 12"></polyline></svg>
                    </div>
                    <div class="new-stat-text">
                      <span class="new-stat-label">今日可借</span>
                      <span class="new-stat-val">${totalAvailable} <small>件</small></span>
                    </div>
                  </div>

                  <!-- 2. 状态良好 -->
                  <div class="new-stat-card">
                    <div class="new-stat-icon-wrapper blue-theme">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="9 11 11 13 15 9"></polyline></svg>
                    </div>
                    <div class="new-stat-text">
                      <span class="new-stat-label">状态良好</span>
                      <span class="new-stat-val">${health}%</span>
                    </div>
                  </div>

                  <!-- 3. 开放场地 -->
                  <div class="new-stat-card">
                    <div class="new-stat-icon-wrapper purple-theme">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line></svg>
                    </div>
                    <div class="new-stat-text">
                      <span class="new-stat-label">开放场地</span>
                      <span class="new-stat-val">${openVenues} <small>个</small></span>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <!-- 🔧 首页重磅加入：无缝联动报修系统的“反馈入口” -->
            <section class="home-feedback-card" data-route="report" style="cursor: pointer; margin-bottom: 16px;">
              <div class="feedback-card-content">
                <div class="feedback-card-text">
                  <h3>💬 反馈器材与场馆问题</h3>
                  <p>球拍磨损、没气、场地受阻？点击一键快速反馈报损</p>
                </div>
                <div class="feedback-arrow">${icon("chevron")}</div>
              </div>
            </section>

            <div class="section-head"><h2>借用流程</h2></div>
            ${flow()}

            <div style="margin-top: 14px;">
              ${currentLoan ? currentLoanCard(currentLoan) : quickStartCard()}
            </div>

            <div class="section-head">
              <h2>热门器材</h2>
              <button class="text-button" data-route="list">查看全部 ${icon("chevron")}</button>
            </div>
            <div class="equipment-grid">
              ${store.equipment.slice(0, 4).map(equipmentCard).join("")}
            </div>
          </main>
          ${tabbar()}
        </section>
      `;
    }

    function kpi(label, value, unit) {
      return `<div class="kpi"><span>${label}</span><strong>${value}<small>${unit}</small></strong></div>`;
    }

    function quickStartCard() {
      return `
        <section class="action-panel">
          <div>
            <h2>查器材</h2>
            <p>借还在场馆机器完成，手机同步记录。</p>
          </div>
          <button class="primary-button" data-route="list">${icon("search")} 查看器材</button>
        </section>
      `;
    }

    function currentLoanCard(loan) {
      const item = byId(loan.equipmentId);
      return `
        <section class="active-loan">
          ${equipmentImage(item, "loan-thumb")}<!-- [IMAGE-FN→loan-thumb] 首页·当前借用卡片 -->
          <div>
            <p class="eyebrow">当前借用</p>
            <h2>${item.name}</h2>
            <p style="font-size: 11px; margin-top: 2px;">${item.assetId} · ${loan.status}</p>
            <div class="button-row" style="margin-top: 8px;">
              <button class="secondary-button" style="min-height:36px; border-radius:10px; font-size:12px;" data-report-loan="${loan.id}">${icon("alert")} 报损</button>
              <button class="primary-button" style="min-height:36px; border-radius:10px; font-size:12px;" data-loan-detect="${loan.id}" data-detect-mode="photo">${icon("camera")} 归还前检测</button>
            </div>
          </div>
        </section>
      `;
    }

    function equipmentCard(item) {
      return `
        <button class="equipment-card" data-detail="${item.id}" aria-label="查看${item.name}">
          ${equipmentImage(item, "item-img")}<!-- [IMAGE-FN→item-img] 首页·热门器材网格 -->
          <span style="width:100%;">
            <strong style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.name}</strong>
            <small>剩余 ${item.available}/${item.total}</small>
            ${tag(item.status)}
          </span>
        </button>
      `;
    }

    function flow() {
      const steps = [
        ["手机看状态", "search"],
        ["机器扫条码", "scan"],
        ["同步记录", "bag"],
        ["拍照检测", "camera"],
        ["管理员维保", "wrench"],
      ];
      return `<div class="flow">${steps.map(([label, svg], index) => `<div><i>${icon(svg)}</i><b>${index + 1}</b><span>${label}</span></div>`).join("")}</div>`;
    }

    function listPage() {
      const categories = ["全部", ...new Set(store.equipment.map((item) => item.category))];
      const filtered = store.equipment.filter((item) => {
        const hitCategory = state.category === "全部" || item.category === state.category;
        const hitQuery = !state.query || item.name.includes(state.query) || item.assetId.includes(state.query.toUpperCase());
        return hitCategory && hitQuery;
      });
      const body = `
        <div class="search-row">
          <label class="search-box">
            ${icon("search")}
            <input id="searchInput" value="${escapeAttr(state.query)}" placeholder="搜索器材或编号" aria-label="搜索器材或编号" />
          </label>
        </div>
        <main class="scroll">
          <div class="chips">
            ${categories.map((name) => `<button class="chip ${state.category === name ? "active" : ""}" data-category="${name}">${name}</button>`).join("")}
          </div>
          <div class="list-meta"><span>${filtered.length} 类器材</span><span>可借优先</span></div>
          <div class="list-stack">${filtered.map(listItem).join("")}</div>
        </main>
      `;
      return shell("器材列表", body);
    }

    function listItem(item) {
      return `
        <button class="list-card" data-detail="${item.id}">
          <span class="list-media">${equipmentImage(item, "list-img")}</span><!-- [IMAGE-FN→list-img] 器材列表页 -->
          <span>
            <strong>${item.name}</strong>
            <small>${item.assetId} · ${cleanVenue(item.venue)}</small>
            <small>剩余 ${item.available}/${item.total} · 良好率 ${item.health}%</small>
          </span>
          ${tag(item.status)}
        </button>
      `;
    }

    function detailPage() {
      const item = byId(state.selectedId);
      const periods = selectedBorrowPeriods();
      const durationText = borrowDurationLabel(periods);
      const body = `
        <main class="scroll">
          <section class="detail-card">
            ${equipmentImage(item, "detail-img")}<!-- [IMAGE-FN→detail-img] 器材详情页主图 -->
            <div class="detail-title">
              <div>
                <h1>${item.name}</h1>
                <p>${item.assetId}</p>
              </div>
              ${tag(item.status)}
            </div>
            <p class="body-text">${item.desc}</p>
            <div class="metric-row">
              ${metric(item.available, "剩余")}
              ${metric(item.total, "总量")}
              ${metric(`${item.health}%`, "良好率")}
            </div>
            <div class="info-list">
              <div><span>可借场馆</span><strong>${cleanVenue(item.venue)}</strong></div>
              <div><span>借用方式</span><strong>到场机器扫码借出，手机同步记录</strong></div>
              <div><span>归还要求</span><strong>手机拍照检测后，到场机器扫码归还</strong></div>
            </div>
            <div class="duration-picker">
              <div class="duration-picker-head">
                <strong>选择借用时长</strong>
                <span>1 节课 = ${CLASS_PERIOD_MINUTES} 分钟</span>
              </div>
              <div class="duration-options">${borrowDurationOptions()}</div>
              <p class="machine-hint" style="margin:0;">当前选择：${durationText}，同步借出后会按这个时间计算归还截止。</p>
            </div>
            <button class="primary-button" data-sync-borrow="${item.id}" ${item.available <= 0 ? "disabled" : ""}>${icon("bag")} 借用</button>
            <p class="machine-hint" style="margin-top:12px;">请先在场馆机器完成借出扫码，再点击上方按钮同步到手机。</p>
          </section>
        </main>
      `;
      return shell("器材详情", body);
    }

    function metric(value, label) {
      return `<div class="metric"><strong>${value}</strong><span>${label}</span></div>`;
    }

    function scanBorrowPage() {
      const isReturn = state.syncContext === "return";
      const loan = isReturn ? loanById(state.activeLoanId) : null;
      const item = isReturn ? byId(loan?.equipmentId || state.selectedId) : byId(state.selectedId);
      const isSuccess = state.scanPhase === "success";
      return `
        <section class="screen scan-screen">
          <header class="scan-screen-header">
            <button class="icon-button" data-back aria-label="返回">${icon("back")}</button>
            <div class="page-title">${isReturn ? "同步归还记录" : "同步借用记录"}</div>
            <span class="scan-header-spacer" aria-hidden="true"></span>
          </header>
          <div class="scan-screen-body">
            ${isSuccess ? `
              <div class="scan-success-card" style="margin:0 auto 18px;">
                <div class="scan-success-icon">${icon("check")}</div>
                <h2 style="margin:0;font-size:22px;">同步成功</h2>
                <p style="margin:8px 0 0;color:rgba(255,255,255,0.72);font-size:14px;">${item.assetId} 已与手机对齐</p>
              </div>
            ` : `
              <div class="sync-visual">
                <span class="sync-ring"></span>
                <span class="sync-ring"></span>
                <span class="sync-ring"></span>
                <div class="sync-core">${icon(isReturn ? "check" : "bag")}</div>
              </div>
            `}
            <p class="scan-hint">
              ${isSuccess ? (isReturn ? "即将更新归还状态" : "即将进入借用确认") : (isReturn ? "正在拉取机器归还记录" : "正在拉取机器借出记录")}
              <strong>${item.name}</strong>
            </p>
            <p class="scan-status-text ${isSuccess ? "" : "is-scanning"}">${isSuccess ? "写入本地记录中…" : "连接场馆设备中…"}</p>
          </div>
        </section>
      `;
    }

    function borrowConfirmPage() {
      const loan = loanById(state.activeLoanId);
      if (!loan) {
        return shell("借用确认", `<main class="scroll"><div class="empty">未找到借用记录。</div></main>`, { tabs: false });
      }
      const item = byId(loan.equipmentId);
      const body = `
        <main class="scroll">
          <section class="result-card">
            <div class="borrow-confirm-hero">
              <div class="borrow-confirm-badge">${icon("check")}</div>
              <h1 style="margin:0;font-size:28px;">借用确认</h1>
              <p class="body-text" style="text-align:center;margin-top:10px;">已从场馆机器同步借出记录，手机端仅展示状态，不执行借出操作。</p>
            </div>
            ${equipmentImage(item, "detail-img")}<!-- [IMAGE-FN→detail-img] 借用确认页 -->
            <div class="detail-title" style="margin-top:14px;">
              <div>
                <h1 style="font-size:24px;">${item.name}</h1>
                <p>${item.assetId}</p>
              </div>
              ${tag("使用中")}
            </div>
            <div class="info-list" style="margin-top:14px;">
              <div><span>借出时间</span><strong>${loan.borrowedAt}</strong></div>
              <div><span>借用时长</span><strong>${loan.durationLabel || "未设置"}</strong></div>
              <div><span>归还截止</span><strong>${loan.dueAt || "未设置"}</strong></div>
              <div><span>可借场馆</span><strong>${cleanVenue(item.venue)}</strong></div>
              <div><span>归还要求</span><strong>先手机检测，再机器扫码归还</strong></div>
            </div>
            <div class="button-row" style="margin-top:18px;">
              <button class="secondary-button" data-detail="${item.id}">查看器材</button>
              <button class="primary-button" data-route="borrow">我的借用</button>
            </div>
            <button class="primary-button" style="margin-top:10px;width:100%;" data-route="home">返回首页</button>
          </section>
        </main>
      `;
      return shell("借用确认", body, { tabs: false });
    }

    function borrowPage() {
      const active = activeBorrowLoans();
      const history = store.loans.filter((loan) => !["使用中", "待归还", "异常待归还"].includes(loan.status));
      const body = `
        <main class="scroll">
          <div class="section-head"><h2>当前借用</h2></div>
          ${active.length ? active.map(loanCard).join("") : `<div class="empty">还没有借用记录。请先在场馆机器完成借出，再在器材详情页点击借用。</div>`}
          <div class="section-head"><h2>历史记录</h2></div>
          <div class="timeline">${history.length ? history.map(historyRow).join("") : `<div class="empty">暂无历史记录。</div>`}</div>
        </main>
      `;
      return shell("我的借用", body, { left: "none" });
    }

    function renewPage() {
      const active = activeBorrowLoans();
      const body = `
        <main class="scroll">
          <section class="action-panel">
            <div>
              <h2>选择要续借的器材</h2>
              <p>续借必须绑定具体借用记录，先点器材，再选择延长时长。</p>
            </div>
          </section>
          <div class="section-head"><h2>当前可续借</h2></div>
          <div class="list-stack">${active.length ? active.map(renewLoanCard).join("") : `<div class="empty">当前没有可续借的器材。请先完成借出同步。</div>`}</div>
        </main>
      `;
      return shell("申请续借", body, { tabs: false });
    }

    function renewLoanCard(loan) {
      const item = byId(loan.equipmentId);
      const renewable = canRenewLoan(loan);
      return `
        <section class="borrow-card" style="margin-bottom: 14px;">
          <div class="borrow-head">
            ${equipmentImage(item, "loan-thumb")}<!-- [IMAGE-FN→loan-thumb] 续借选择·当前借用卡片 -->
            <div>
              <h2>${item.name}</h2>
              <p style="font-size: 11px; margin-top:2px;">${item.assetId} · ${loan.borrowedAt}</p>
              <p style="font-size: 11px; margin-top:2px;">当前截止 ${loan.dueAt || "未设置"}</p>
              ${tag(loan.status)}
            </div>
          </div>
          <div class="button-row" style="margin-top: 14px;">
            <button class="secondary-button" data-detail="${item.id}">查看器材</button>
            <button class="primary-button" data-renew-loan="${loan.id}" ${renewable ? "" : "disabled"}>${icon("refresh")} 申请续借</button>
          </div>
          ${renewable ? "" : `<p class="machine-hint">这条记录已经进入归还或异常流程，不能再续借。</p>`}
        </section>
      `;
    }

    function renewDetailPage() {
      const loan = loanById(state.activeLoanId);
      if (!loan) {
        return shell("续借确认", `<main class="scroll"><div class="empty">未找到要续借的借用记录。</div></main>`, { tabs: false });
      }
      const item = byId(loan.equipmentId);
      const periods = selectedBorrowPeriods();
      const extensionLabel = borrowDurationLabel(periods);
      const newDueAtMs = renewedDueAtMs(loan, periods);
      const renewable = canRenewLoan(loan);
      const body = `
        <main class="scroll">
          <section class="result-card">
            ${equipmentImage(item, "detail-img")}<!-- [IMAGE-FN→detail-img] 续借确认页 -->
            <div class="detail-title" style="margin-top:14px;">
              <div>
                <h1 style="font-size:24px;">${item.name}</h1>
                <p>${item.assetId}</p>
              </div>
              ${tag(loan.status)}
            </div>
            <div class="info-list" style="margin-top:14px;">
              <div><span>借出时间</span><strong>${loan.borrowedAt}</strong></div>
              <div><span>当前截止</span><strong>${loan.dueAt || "未设置"}</strong></div>
              <div><span>续借时长</span><strong>${extensionLabel}</strong></div>
              <div><span>续借后截止</span><strong>${formatDueTime(newDueAtMs)}</strong></div>
            </div>
            <div class="duration-picker">
              <div class="duration-picker-head">
                <strong>选择续借时长</strong>
                <span>1 节课 = ${CLASS_PERIOD_MINUTES} 分钟</span>
              </div>
              <div class="duration-options">${borrowDurationOptions()}</div>
              <p class="machine-hint" style="margin:0;">续借会从当前截止时间继续往后算；如果已经超时，则从现在开始算。</p>
            </div>
            <button class="primary-button" data-submit-renew="${loan.id}" ${renewable ? "" : "disabled"}>${icon("refresh")} 提交续借申请</button>
            ${renewable ? "" : `<p class="machine-hint">这条记录当前不可续借，请按归还流程处理。</p>`}
          </section>
        </main>
      `;
      return shell("续借确认", body, { tabs: false });
    }

    function loanCard(loan) {
      const item = byId(loan.equipmentId);
      const canReturn = loan.status === "待归还" || loan.status === "异常待归还";
      return `
        <section class="borrow-card" style="margin-bottom: 14px;">
          <div class="borrow-head">
            ${equipmentImage(item, "loan-thumb")}<!-- [IMAGE-FN→loan-thumb] 我的借用·当前借用卡片 -->
            <div>
              <h2>${item.name}</h2>
              <p style="font-size: 11px; margin-top:2px;">${item.assetId} · ${loan.borrowedAt}</p>
              <p style="font-size: 11px; margin-top:2px;">${loan.durationLabel || "未设置时长"} · 截止 ${loan.dueAt || "未设置"}</p>
              ${tag(loan.status)}
            </div>
          </div>
          <div class="button-row ${canRenewLoan(loan) ? "loan-action-row" : ""}" style="margin-top: 14px;">
            <button class="secondary-button" data-report-loan="${loan.id}">${icon("alert")} 报损</button>
            ${canRenewLoan(loan) ? `<button class="secondary-button" data-renew-loan="${loan.id}">${icon("refresh")} 续借</button>` : ""}
            ${canReturn
              ? `<button class="primary-button" data-sync-return="${loan.id}">${icon("bag")} 同步归还状态</button>`
              : `<button class="primary-button" data-loan-detect="${loan.id}">${icon("camera")} 归还前检测</button>`}
          </div>
        </section>
      `;
    }

    function historyRow(loan) {
      const item = byId(loan.equipmentId);
      const punctualText = loan.returnedOnTime === true ? "准时" : (loan.returnedOnTime === false ? "超时" : "未计入准时率");
      return `<div class="timeline-item"><strong>${item.name}</strong><span>${loan.status} · ${loan.returnedAt || loan.borrowedAt} · ${punctualText}</span></div>`;
    }

    function detectPage() {
      const loan = loanById(state.activeLoanId) || activeLoan();
      if (!loan) return shell("归还前检测", `<main class="scroll"><div class="empty">没有可检测的借用记录。</div></main>`);
      const item = byId(loan.equipmentId);
      const body = `
        <main class="scroll">
          <section class="camera-panel">
            <div class="camera-box">
              ${equipmentImage(item, "camera-img")}<!-- [IMAGE-FN→camera-img] 归还前检测 -->
              <span class="scan-line"></span>
